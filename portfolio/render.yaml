services:
  - type: web
    name: portfolio-frontend
    runtime: static
    plan: free
    rootDir: portfolio
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://portfolio-backend-arms.onrender.com/api

  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    rootDir: portfolio/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://portfolio-frontend-nzsu.onrender.com
